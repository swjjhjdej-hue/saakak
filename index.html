<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصدر الزيارة</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            direction: rtl;
        }

        .box {
            background: white;
            padding: 30px 45px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
            text-align: center;
        }

        .title {
            font-size: 20px;
            color: #555;
            margin-bottom: 15px;
        }

        #source {
            font-size: 28px;
            font-weight: bold;
            color: #111;
            direction: ltr;
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="title">تم تحويلك من النطاق:</div>
        <div id="source">جاري التحقق...</div>
    </div>

    <script>
        const referrer = document.referrer;
        const sourceElement = document.getElementById("source");

        if (referrer) {
            try {
                const url = new URL(referrer);
                sourceElement.textContent = url.hostname;
            } catch (error) {
                sourceElement.textContent = "غير معروف";
            }
        } else {
            sourceElement.textContent = "مباشرة";
        }
    </script>

</body>
</html>
